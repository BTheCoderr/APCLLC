[build]
  command = "CI=false NODE_OPTIONS=--max-old-space-size=4096 NEXT_TELEMETRY_DISABLED=1 npm run build"
  publish = ".next"
  ignore_warnings = true

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  NEXT_PUBLIC_METADATA_BASE_URL = "https://apcllc.co"
  TYPESCRIPT_SKIP_TYPECHECK = "true"
  CI = "false"
  # Keep these names in the Netlify UI only. Do not put secret values in git:
  # RESEND_API_KEY, DATABASE_URL, ADMIN_API_KEY

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"

[[redirects]]
  from = "/lander"
  to = "/"
  status = 301
  force = true

[dev]
  command = "npm run dev"
  port = 4000
  targetPort = 4000
  framework = "next"
